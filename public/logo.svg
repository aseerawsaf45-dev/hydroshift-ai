<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Radar Swath & Delta Cyan Flow Gradient -->
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Hydrodynamic Secondary Streamline Gradient -->
    <linearGradient id="logoEmeraldGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Precision Geometric Abstract Mark -->
  <g filter="url(#logoGlow)" transform="translate(80, 80) scale(1.1) translate(-60, -66)">
    <!-- Primary Radar Swath Orbit (North loop) -->
    <path
      d="M36,46 C36,31 48,22 64,22 C78,22 90,30 90,44 C90,56 79,62 67,65 C51,69 32,74 32,90 C32,102 44,110 60,110 C76,110 88,100 90,92"
      fill="none"
      stroke="url(#logoCyanGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Secondary Estuarine Ingress Streamline -->
    <path
      d="M84,40 C84,33 76,28 66,28 C54,28 44,35 44,46 C44,55 53,60 65,63 C81,67 96,73 96,88 C96,101 84,108 68,108 C54,108 42,100 38,91"
      fill="none"
      stroke="url(#logoEmeraldGrad)"
      stroke-width="5.5"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Central KaRIn Satellite Nadir Pulse Core -->
    <circle cx="60" cy="65" r="5" fill="#ffffff" />
    <circle cx="60" cy="65" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" stroke-dasharray="2, 2" />

    <!-- Satellite & Estuary Apex Nodes -->
    <circle cx="64" cy="22" r="3.5" fill="#38bdf8" />
    <circle cx="60" cy="110" r="3.5" fill="#10b981" />
  </g>
</svg>
