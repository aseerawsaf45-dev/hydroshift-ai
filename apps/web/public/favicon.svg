<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient for Squircle Favicon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08131f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Radar Swath & Delta Cyan Flow Gradient -->
    <linearGradient id="cyanDeltaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Inverse Streamline Emerald-Cyan Flow -->
    <linearGradient id="emeraldStreamGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="swotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Frame with Precision Border -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Geometric Abstract SWOT Radar S-Curve Flow -->
  <g filter="url(#swotGlow)" transform="translate(60, 60) scale(0.9) translate(-60, -60)">
    <!-- Outer Radar Swath Arc (Northern Freshwater Loop) -->
    <path
      d="M36,46 C36,31 48,22 64,22 C78,22 90,30 90,44 C90,56 79,62 67,65 C51,69 32,74 32,90 C32,102 44,110 60,110 C76,110 88,100 90,92"
      fill="none"
      stroke="url(#cyanDeltaGrad)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Harmonized Interferometry Wave (Southern Estuarine Surge) -->
    <path
      d="M84,40 C84,33 76,28 66,28 C54,28 44,35 44,46 C44,55 53,60 65,63 C81,67 96,73 96,88 C96,101 84,108 68,108 C54,108 42,100 38,91"
      fill="none"
      stroke="url(#emeraldStreamGrad)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Center KaRIn Radar Core Axis / Satellite Nadir Beacon -->
    <circle cx="60" cy="65" r="4.5" fill="#ffffff" />
    <circle cx="60" cy="65" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6" stroke-dasharray="2, 2" />

    <!-- Orbital Elevation Apex Accent -->
    <circle cx="64" cy="22" r="3" fill="#38bdf8" />
    <circle cx="60" cy="110" r="3" fill="#10b981" />
  </g>
</svg>
